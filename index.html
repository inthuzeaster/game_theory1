<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Theory</title>
<style>
:root{--bg:#070713;--card:rgba(255,255,255,.05);--fg:#eef0ff;--mut:#9a9cc4;--a:#8b5cf6;--b:#22d3ee;--line:rgba(255,255,255,.12);--glow:.35;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f2ff;--card:rgba(255,255,255,.75);--fg:#171633;--mut:#5d5f86;--a:#6d3fe0;--b:#0891b2;--line:rgba(60,50,140,.16);--glow:.12;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f2ff;--card:rgba(255,255,255,.75);--fg:#171633;--mut:#5d5f86;--a:#6d3fe0;--b:#0891b2;--line:rgba(60,50,140,.16);--glow:.12;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(40vmax 40vmax at 85% 10%,var(--a),transparent 70%),radial-gradient(36vmax 36vmax at 5% 95%,var(--b),transparent 70%);opacity:var(--glow);animation:drift 14s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
@keyframes drift{to{transform:scale(1.15) translate(-2%,2%)}}
.deck{height:100%;position:relative;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 8vw;opacity:0;visibility:hidden;transform:translateX(50px) scale(.98);transition:opacity .5s,transform .5s,visibility .5s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.past{transform:translateX(-50px) scale(.98)}
.slide[data-s="A"]{--c:var(--a)}.slide[data-s="B"]{--c:var(--b)}.slide[data-s="T"]{--c:var(--a)}
.tag{align-self:flex-start;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.35rem .9rem;border-radius:99px;color:var(--c);border:1px solid var(--c);background:var(--card);box-shadow:0 0 18px -4px var(--c);margin-bottom:1.1rem}
.g{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(2.6rem,8vw,5.5rem);margin:0 0 .6rem;line-height:1.02;letter-spacing:-.02em}
h2{font-size:clamp(1.8rem,4.5vw,3.2rem);margin:0 0 1.4rem;line-height:1.12;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:clamp(1rem,2vw,1.4rem);max-width:44ch}
.row{display:flex;gap:3vw;align-items:center;flex-wrap:wrap}.row>div:first-child{flex:1 1 20rem}
ul{list-style:none;padding:0;margin:0;display:grid;gap:.75rem;max-width:60rem}
li{font-size:clamp(1rem,2.1vw,1.5rem);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:14px;padding:.8rem 1.1rem;backdrop-filter:blur(10px);opacity:0;transform:translateY(16px)}
.on li{animation:up .55s forwards;animation-delay:calc(.15s + var(--i)*.13s)}
@keyframes up{to{opacity:1;transform:none}}
.ex{margin-top:1.2rem;color:var(--mut);font-size:clamp(.95rem,1.8vw,1.2rem)}.ex b{color:var(--c)}
table{border-collapse:separate;border-spacing:6px;margin-top:1rem;font-size:clamp(.9rem,1.9vw,1.3rem)}
td,th{padding:.7rem 1.1rem;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px}
th{color:var(--mut);font-weight:600;background:none;border:0}td.n{border-color:var(--c);box-shadow:0 0 22px -4px var(--c);font-weight:700}
.pic{width:clamp(150px,22vw,260px);aspect-ratio:3/4;border-radius:20px;border:1px dashed var(--c);display:grid;place-items:center;text-align:center;color:var(--mut);background:var(--card);box-shadow:0 0 40px -10px var(--c);font-size:.85rem;padding:1rem}
.pic b{display:block;font-size:2.6rem;margin-bottom:.3rem}
.bar{position:fixed;left:0;top:0;height:4px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 12px var(--b);transition:width .3s;z-index:5}
.nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:18px;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.9rem;z-index:5}
.nav button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;backdrop-filter:blur(8px)}
.nav button:hover{border-color:var(--b)}
img.pic{border-style:solid;object-fit:cover;padding:0}
.pic.ph{aspect-ratio:1;width:clamp(170px,26vw,320px)}
table.pd{border-spacing:10px;font-size:clamp(1.2rem,3.2vw,2.3rem);margin-top:1rem}
table.pd td{padding:clamp(1rem,3vw,2rem) clamp(1.2rem,4vw,3rem);border-radius:18px;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(34,211,238,.15));font-weight:700;border-color:var(--line)}
table.pd th{font-size:clamp(.85rem,1.6vw,1.1rem)}
.x{color:var(--a)}.y{color:var(--b)}
.math{font-family:"Cambria Math",Cambria,Georgia,serif;font-style:italic;font-size:clamp(1.05rem,2.5vw,1.8rem);padding:1rem 1.4rem;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:1rem 0;overflow-x:auto;max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;max-width:62rem}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:1.1rem 1.3rem;font-size:clamp(.9rem,1.7vw,1.15rem);line-height:1.5}
.card h3{margin:0 0 .5rem;color:var(--c);font-size:1.3em}
.chain{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:1.1rem;color:var(--mut)}
.chain span{background:var(--card);border:1px solid var(--c);border-radius:10px;padding:.4rem .8rem;color:var(--fg);font-size:clamp(.8rem,1.6vw,1.05rem)}
.mt{border-collapse:separate;border-spacing:4px;font-size:clamp(.95rem,2vw,1.4rem);font-family:"Cambria Math",Georgia,serif}.mt td.h{border-color:var(--c);box-shadow:0 0 18px -4px var(--c);font-weight:700}
svg.dg{width:100%;max-width:62rem;height:auto}svg.dg text{fill:var(--fg);font-size:16px;text-anchor:middle;font-weight:600}svg.dg .s{fill:var(--mut);font-weight:400;font-size:14px}
svg.dg .bx{fill:var(--card);stroke:var(--line);stroke-width:1.5}svg.dg .ga{stroke:var(--a);stroke-width:2.5}svg.dg .gb{stroke:var(--b);stroke-width:2.5}
svg.dg .ln{fill:none;stroke:var(--mut);stroke-width:2;marker-end:url(#ar)}svg.dg .fl{fill:none;stroke:var(--b);stroke-width:3;stroke-dasharray:9 7;animation:dash 1s linear infinite;marker-end:url(#ar)}
@keyframes dash{to{stroke-dashoffset:-16}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="deck" id="deck"></div>
<div class="nav"><button id="prev" aria-label="Previous">←</button><span id="count"></span><button id="next" aria-label="Next">→</button></div>

{s:'T',t:'Game <span class="g">Theory</span>',sub:'From John von Neumann and the Prisoner’s Dilemma to GANs'},
{s:'A',t:'John von Neumann',p:['Born 1903 in Budapest, Hungary; died 1957 in Washington, D.C.','Studied chemical engineering at ETH Zurich and earned a PhD in mathematics at the University of Budapest (1926)','Also studied in Berlin, then worked at Göttingen before moving to Princeton','Proved the minimax theorem (1928); co-wrote <i>Theory of Games and Economic Behavior</i> (1944)'],pic:1},
{s:'A',t:'The Prisoner’s Dilemma',p:['Two suspects are questioned in separate rooms','Each can confess (betray the other) or deny (stay silent)','Confessing is the best reply to anything the other does','Yet both confessing leaves both worse off than both denying']},
{s:'A',t:'Prisoner’s Dilemma: the Chart',x:PD},
{s:'A',t:'Complete vs. Incomplete Information',p:['Complete: everyone knows the players, strategies and payoffs','Incomplete: some players lack part of that knowledge (e.g. an opponent’s payoffs or type)']},
{s:'A',t:'Best Response',p:['The strategy with the highest payoff, given what the others do','A strategy can be a best response to one choice and not to another']},
{s:'A',t:'Dominant Strategies',p:['Strictly dominant: better than every alternative, whatever the others do','Weakly dominant: never worse, and sometimes better','A rational player simply plays it'],x:'<b>Example:</b> confessing in the Prisoner’s Dilemma.'},
{s:'A',t:'Non-Dominant Strategies',p:['Dominated: another strategy is always at least as good (strictly or weakly)','Dominated strategies can be eliminated from the game','Some games have no dominant strategy at all'],x:'<b>Example:</b> rock, paper, scissors.'},
{s:'A',t:'Zero-Sum Games',p:['One player’s gain is exactly the other’s loss','Total payoff is always zero: u₁ + u₂ = 0','Pure conflict: there is no room for cooperation','Next: the maximin principle, then chess and poker']},
{s:'A',t:'Maximin: the Idea',p:['Assume the opponent will hurt you as much as possible','For each of your strategies, find the worst payoff it can give','Choose the strategy whose worst case is best (“maximize the minimum”)'],x:'<div class="math">v<sub>A</sub> = max<sub>s∈S<sub>A</sub></sub> min<sub>t∈S<sub>B</sub></sub> u<sub>A</sub>(s, t)</div>The opponent does the mirror image, <i>minimax</i>: v̄ = min<sub>t</sub> max<sub>s</sub> u<sub>A</sub>(s, t). Always v<sub>A</sub> ≤ v̄.'},
{s:'A',t:'Maximin: Worked Example',p:['Payoffs to A. Row minimum = worst case of each strategy','Maximin: A2, because its worst case (0) beats −1 and −2','Minimax: B picks the column with the smallest maximum, which is 2','0 ≠ 2: no saddle point, so mixed strategies are needed. Von Neumann’s minimax theorem says max min = min max once mixing is allowed'],raw:'<table class="mt"><tr><td></td><td>B1</td><td>B2</td><td>B3</td><td>row min</td></tr><tr><td>A1</td><td>3</td><td>−1</td><td>2</td><td>−1</td></tr><tr><td>A2</td><td>1</td><td>0</td><td>2</td><td class="h">0</td></tr><tr><td>A3</td><td>−2</td><td>4</td><td>1</td><td>−2</td></tr><tr><td>col max</td><td>3</td><td>4</td><td class="h">2</td><td></td></tr></table>'},
{s:'A',t:'Zero-Sum in Practice',raw:'<div class="cards"><div class="card"><h3>Chess</h3>Two players, no hidden information. Win = +1, draw = 0, loss = −1, so the payoffs always cancel out.<br>Zermelo’s theorem (1913): in such finite games, either one side can force a win or both can force at least a draw.<br>But there are around 10<sup>120</sup> possible games (the Shannon number), so the perfect strategy is still unknown.</div><div class="card"><h3>Poker</h3>Cards are hidden, so information is incomplete. What one player wins, the others lose (apart from the house’s cut).<br>Bluffing is a mixed strategy: good players randomize so opponents cannot exploit a pattern.<br>Heads-up limit hold’em was essentially solved in 2015 by the Cepheus program from the University of Alberta.</div></div>'},
{s:'A',t:'Non-Zero-Sum Games',p:['Total payoff changes depending on the choices made','Players can all gain (win-win) or all lose','Cooperation becomes possible and sometimes valuable'],x:'<b>Example:</b> the Prisoner’s Dilemma, trade agreements.'},
{s:'A',t:'What Is a GAN?',p:['Generative Adversarial Network, introduced by Ian Goodfellow and colleagues in 2014','Goal: generate new data that looks real (faces, art, music)','Two neural networks play against each other: a generator that makes fakes and a discriminator that judges them','Like a counterfeiter and a bank inspector, each forcing the other to improve','“Adversarial” means a game, so GANs are game theory in action']},
{s:'A',t:'The GAN as a Minimax Game',p:['D (discriminator) wants to maximize V: say “real” for real data, “fake” for G’s output','G (generator) wants to minimize V: make D believe its fakes are real','Zero-sum: D’s gain is G’s loss, just like the maximin idea','At the equilibrium, G’s output matches the real data and D can only guess (D = ½)'],x:'<div class="math">min<sub>G</sub> max<sub>D</sub> V(D, G) = E<sub>x∼p<sub>data</sub></sub>[log D(x)] + E<sub>z∼p<sub>z</sub></sub>[log(1 − D(G(z)))]</div>'},
{s:'A',t:'Generator vs. Discriminator',p:['Generator: turns random noise into fake data (e.g. images)','Discriminator: judges whether data is real or fake'],raw:DG},
{s:'A',t:'The Training Loop',p:['1. G turns random noise into a fake image','2. D receives a mix of real and fake images and guesses which is which','3. D is updated to catch fakes better; G is updated, using D’s feedback, to fool D better','4. Repeat thousands of times: fakes get more convincing and D gets sharper, until D is right only about 50% of the time']},
{s:'A',t:'Problems of GANs',p:['Mode collapse: the generator produces only a few kinds of output','Unstable training: the two networks may never settle at equilibrium','Vanishing gradients when the discriminator gets too strong','Hard to measure how good the results really are']},
{s:'A',t:'CNN: What and Why',p:['Convolutional Neural Network, built for grid-like data such as images','An image is a grid of pixels (numbers 0–255); color images have 3 channels (R, G, B)','A plain dense network needs a weight for every pixel: a 224×224 color image has 150,528 inputs per neuron','A CNN reuses small filters across the image: far fewer parameters, and a pattern is found wherever it appears','Used in face recognition, medical imaging, self-driving cars']},
{s:'A',t:'Convolution: Sliding a Filter',p:['A small filter (kernel), e.g. 3×3, slides across the image','At each position: multiply, add up, write one number into the feature map','Early filters detect edges; deeper ones detect shapes and object parts'],x:'<div class="math">(I ∗ K)(i, j) = Σ<sub>m</sub> Σ<sub>n</sub> I(i+m, j+n) · K(m, n)</div>',pic:2},
{s:'A',t:'Pooling and Architecture',p:['ReLU: f(x) = max(0, x) adds non-linearity','Max pooling (2×2) keeps the strongest value in each block and halves the size','Stack the blocks, then flatten and classify with fully connected layers and softmax (probabilities)','Link to GANs: image GANs (such as DCGAN) use CNNs in both the generator and the discriminator'],raw:'<div class="chain"><span>Image</span>→<span>Conv + ReLU</span>→<span>Pool</span>→<span>Conv + ReLU</span>→<span>Pool</span>→<span>Flatten</span>→<span>Dense</span>→<span>Softmax</span></div>'},
{s:'B',t:'Nash Equilibrium',p:['No player gains by changing strategy alone','Pure Nash equilibrium: each player picks one fixed strategy','Every player is playing a best response to the others'],x:'<b>Example:</b> two companies choosing prices or profit levels.'},
{s:'B',t:'Pareto Optimality',p:['No one can be better off without making someone worse off','A state can be both Nash and Pareto optimal','Prisoner’s Dilemma: Nash, but not Pareto optimal']},
{s:'B',t:'Repeated Games',p:['The same game is played again and again','Cooperation pays: today’s choice affects future interactions'],x:'<b>Example:</b> sharing the dishes day after day.'},
{s:'B',t:'Robert Axelrod',p:['Ran computer tournaments of the repeated Prisoner’s Dilemma','Tit for tat: cooperate first, then copy the opponent’s last move','Tit for two tats: only retaliate after two defections']},
{s:'B',t:'Repeated-Game Strategies',p:['Always cooperate','Always defect','Grim trigger: cooperate until betrayed, then defect forever','Win-Stay, Lose-Shift: reacts to the outcome, not only to cooperation']},
{s:'B',t:'Mixed Strategies',p:['Randomly choose between actions with set probabilities','Not irrational: the odds must fit the payoffs and the game’s structure']},
{s:'B',t:'Mixed-Strategy Nash Equilibrium',p:['Each player randomizes so the opponent is indifferent between options','No one gains by changing their probabilities'],x:'<b>Example:</b> rock, paper, scissors, each at 1/3.'},
{s:'B',t:'Bayesian Nash Equilibrium',p:['Nash equilibrium for games with incomplete information','Players hold beliefs about hidden information (types)','Each strategy is a best response given those beliefs']},
{s:'T',t:'Thank <span class="g">You</span>',sub:'Questions?'}

var d=document.getElementById('deck'),i=0,tot=S.length;
S.forEach(function(o){
 var e=document.createElement('section');e.className='slide';e.dataset.s=o.s;var h='';
 if(o.s==='T'){h='<h1>'+o.t+'</h1><div class="sub">'+o.sub+'</div>'}
 else{h='<span class="tag">Person '+o.s+'</span><h2>'+o.t+'</h2>';
  var l=(o.p?'<ul>'+o.p.map(function(x,k){return '<li style="--i:'+k+'">'+x+'</li>'}).join('')+'</ul>':'')+(o.x?'<div class="ex">'+o.x+'</div>':'');
  h+=(o.pic?'<div class="row"><div>'+l+'</div>'+(o.pic===2?PH:PIC)+'</div>':l)+(o.raw||'');}
 e.innerHTML=h;d.appendChild(e);
});
var el=d.children;
function go(n){
 i=Math.max(0,Math.min(tot-1,n));
 for(var k=0;k<tot;k++){el[k].className='slide'+(k===i?' on':k<i?' past':'')}
 document.getElementById('bar').style.width=((i+1)/tot*100)+'%';
 document.getElementById('count').textContent=(i+1)+' / '+tot;
}
document.getElementById('next').onclick=function(){go(i+1)};
document.getElementById('prev').onclick=function(){go(i-1)};
document.addEventListener('keydown',function(e){
 if(['ArrowRight','ArrowDown','PageDown',' '].indexOf(e.key)>-1){e.preventDefault();go(i+1)}
 if(['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key)>-1){e.preventDefault();go(i-1)}
 if(e.key==='Home')go(0);if(e.key==='End')go(tot-1);
});
var x0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(i+(dx<0?1:-1));x0=null});
go(0);
</script>
